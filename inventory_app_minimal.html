
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--color-background-primary)}
.layout{display:flex;min-height:620px}
.sidebar{width:52px;background:var(--color-background-primary);border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.logo{width:32px;height:32px;background:var(--color-background-tertiary);border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.si{width:36px;height:36px;border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text-tertiary);transition:all 0.15s;position:relative}
.si:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.si.active{background:var(--color-background-secondary);color:var(--color-text-primary)}
.si i{font-size:18px}
.si .tip{position:absolute;left:44px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);padding:4px 8px;border-radius:var(--border-radius-md);font-size:12px;white-space:nowrap;color:var(--color-text-primary);display:none;z-index:99;pointer-events:none}
.si:hover .tip{display:block}
.main{flex:1;overflow:hidden}
.topbar{height:48px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;padding:0 20px;justify-content:space-between}
.topbar-title{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.topbar-right{display:flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--color-background-tertiary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--color-text-secondary)}
.content{padding:20px;overflow-y:auto;height:calc(620px - 48px)}
.pg{display:none}.pg.on{display:block}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.kpi{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px 14px}
.kpi-l{font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.04em}
.kpi-v{font-size:22px;font-weight:500;color:var(--color-text-primary)}
.kpi-v.a{color:#BA7517}.kpi-v.r{color:#E24B4A}.kpi-v.g{color:#639922}
.sect{margin-bottom:20px}
.sect-hd{font-size:12px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px}
.row:last-child{border-bottom:none}
.row-name{flex:1;color:var(--color-text-primary);font-weight:500}
.row-sub{font-size:11px;color:var(--color-text-tertiary);font-weight:400}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:500}
.chip-g{background:#EAF3DE;color:#3B6D11}
.chip-a{background:#FAEEDA;color:#854F0B}
.chip-r{background:#FCEBEB;color:#A32D2D}
.chip-b{background:#E6F1FB;color:#185FA5}
.chip-gr{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.bar-wrap{width:60px;height:4px;background:var(--color-border-tertiary);border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar-fill{height:100%;border-radius:2px}
.input-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.search{display:flex;align-items:center;gap:6px;padding:0 10px;height:32px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);flex:1}
.search input{border:none;background:none;font-size:13px;outline:none;width:100%;color:var(--color-text-primary)}
.search i{color:var(--color-text-tertiary);font-size:15px}
select{height:32px;padding:0 8px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);font-size:12px;color:var(--color-text-primary);outline:none}
.btn{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:var(--border-radius-md);font-size:12px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);transition:background 0.12s}
.btn:hover{background:var(--color-background-secondary)}
.btn-primary{background:var(--color-text-primary);color:var(--color-background-primary);border-color:transparent}
.btn-primary:hover{opacity:0.85}
.qty{display:flex;align-items:center;gap:4px}
.qb{width:22px;height:22px;border:0.5px solid var(--color-border-secondary);border-radius:6px;background:var(--color-background-secondary);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--color-text-primary);transition:background 0.1s}
.qb:hover{background:var(--color-background-tertiary)}
.qi{width:34px;text-align:center;border:0.5px solid var(--color-border-secondary);border-radius:6px;padding:2px 0;font-size:12px;background:var(--color-background-primary);color:var(--color-text-primary)}
.dn-card{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:16px;margin-bottom:12px}
.dn-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-bottom:12px}
.dn-f{font-size:11px;color:var(--color-text-tertiary);margin-bottom:1px}
.dn-v{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.toast{position:fixed;bottom:14px;right:14px;background:var(--color-text-primary);color:var(--color-background-primary);padding:9px 14px;border-radius:var(--border-radius-md);font-size:13px;opacity:0;transition:opacity 0.2s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.empty{text-align:center;padding:32px 0;color:var(--color-text-tertiary);font-size:13px}
.tab-row{display:flex;gap:0;margin-bottom:16px;border-bottom:0.5px solid var(--color-border-tertiary)}
.tab{padding:7px 14px;font-size:12px;cursor:pointer;color:var(--color-text-tertiary);border-bottom:2px solid transparent;margin-bottom:-0.5px;transition:color 0.1s}
.tab:hover{color:var(--color-text-primary)}
.tab.on{color:var(--color-text-primary);font-weight:500;border-bottom-color:var(--color-text-primary)}
</style>

<h2 class="sr-only">BranchStock — inventory and ordering app for branch teams</h2>

<div class="layout">
<div class="sidebar">
  <div class="logo"><i class="ti ti-box" style="font-size:16px;color:var(--color-text-secondary)" aria-hidden="true"></i></div>
  <div class="si active" onclick="go('dashboard')" id="si-dashboard"><i class="ti ti-layout-dashboard" aria-label="Dashboard"></i><span class="tip">Dashboard</span></div>
  <div class="si" onclick="go('inventory')" id="si-inventory"><i class="ti ti-stack-2" aria-label="Inventory"></i><span class="tip">Inventory</span></div>
  <div class="si" onclick="go('order')" id="si-order"><i class="ti ti-shopping-cart" aria-label="Place order"></i><span class="tip">Place order</span></div>
  <div class="si" onclick="go('orders')" id="si-orders"><i class="ti ti-list-check" aria-label="My orders"></i><span class="tip">My orders</span></div>
  <div class="si" onclick="go('delivery')" id="si-delivery"><i class="ti ti-file-description" aria-label="Delivery notes"></i><span class="tip">Delivery notes</span></div>
  <div style="flex:1"></div>
  <div class="si"><i class="ti ti-settings" aria-label="Settings"></i><span class="tip">Settings</span></div>
</div>

<div class="main">
<div class="topbar">
  <span class="topbar-title" id="pg-title">Dashboard</span>
  <div class="topbar-right">
    <span style="font-size:12px;color:var(--color-text-tertiary)">KL Branch</span>
    <div class="avatar">KL</div>
  </div>
</div>

<div class="content">

<div id="pg-dashboard" class="pg on">
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-l">Pending</div><div class="kpi-v a" id="k-pend">3</div></div>
    <div class="kpi"><div class="kpi-l">Delivered</div><div class="kpi-v g">12</div></div>
    <div class="kpi"><div class="kpi-l">Low stock</div><div class="kpi-v r" id="k-low">2</div></div>
    <div class="kpi"><div class="kpi-l">Products</div><div class="kpi-v">18</div></div>
  </div>
  <div class="sect">
    <div class="sect-hd">Recent orders</div>
    <div id="d-orders"></div>
  </div>
  <div class="sect">
    <div class="sect-hd">Low stock alerts</div>
    <div id="d-low"></div>
  </div>
</div>

<div id="pg-inventory" class="pg">
  <div class="input-row">
    <div class="search"><i class="ti ti-search" aria-hidden="true"></i><input id="inv-q" placeholder="Search products…" oninput="rInv()"></div>
    <select id="inv-cat" onchange="rInv()">
      <option value="">All categories</option>
      <option>Beverages</option><option>Cleaning</option><option>Packaging</option><option>Raw materials</option>
    </select>
  </div>
  <div id="inv-list"></div>
</div>

<div id="pg-order" class="pg">
  <div class="input-row">
    <div class="search"><i class="ti ti-search" aria-hidden="true"></i><input id="ord-q" placeholder="Search products…" oninput="rOrd()"></div>
    <button class="btn btn-primary" onclick="submitOrder()"><i class="ti ti-send" style="font-size:13px" aria-hidden="true"></i>Submit order ↗</button>
  </div>
  <div id="ord-list"></div>
  <div style="margin-top:14px;display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:0.5px solid var(--color-border-tertiary)">
    <span style="font-size:13px;color:var(--color-text-secondary)">Items in cart: <span id="cart-n" style="font-weight:500;color:var(--color-text-primary)">0</span></span>
    <button class="btn btn-primary" onclick="submitOrder()">Submit ↗</button>
  </div>
</div>

<div id="pg-orders" class="pg">
  <div class="tab-row">
    <div class="tab on" onclick="fOrders('all',this)">All</div>
    <div class="tab" onclick="fOrders('pending',this)">Pending</div>
    <div class="tab" onclick="fOrders('approved',this)">Approved</div>
    <div class="tab" onclick="fOrders('delivered',this)">Delivered</div>
  </div>
  <div id="orders-list"></div>
</div>

<div id="pg-delivery" class="pg">
  <div id="dn-list"></div>
</div>

</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const P=[
  {id:1,n:'Mineral water 500ml',sku:'BEV-001',cat:'Beverages',unit:'Carton (24)',s:120,max:20,th:20},
  {id:2,n:'Coffee blend A',sku:'BEV-002',cat:'Beverages',unit:'Kg bag',s:45,max:10,th:10},
  {id:3,n:'Orange juice 1L',sku:'BEV-003',cat:'Beverages',unit:'Carton (12)',s:8,max:15,th:10},
  {id:4,n:'Floor cleaner 5L',sku:'CLN-001',cat:'Cleaning',unit:'Bottle',s:30,max:8,th:5},
  {id:5,n:'Sanitiser spray',sku:'CLN-002',cat:'Cleaning',unit:'Bottle',s:4,max:12,th:6},
  {id:6,n:'Paper cups 8oz',sku:'PKG-001',cat:'Packaging',unit:'Pack (50)',s:200,max:30,th:30},
  {id:7,n:'Takeaway boxes M',sku:'PKG-002',cat:'Packaging',unit:'Pack (100)',s:90,max:20,th:20},
  {id:8,n:'Sugar (white)',sku:'RAW-001',cat:'Raw materials',unit:'5kg bag',s:60,max:15,th:15},
  {id:9,n:'Creamer powder',sku:'RAW-002',cat:'Raw materials',unit:'1kg pack',s:25,max:10,th:8},
];

let O=[
  {id:'ORD-2024',date:'2025-04-28',items:[{n:'Mineral water 500ml',q:10},{n:'Coffee blend A',q:5}],status:'delivered',dn:'DN-2024'},
  {id:'ORD-2025',date:'2025-04-30',items:[{n:'Paper cups 8oz',q:20},{n:'Takeaway boxes M',q:10}],status:'approved',dn:null},
  {id:'ORD-2026',date:'2025-05-02',items:[{n:'Floor cleaner 5L',q:4}],status:'pending',dn:null},
  {id:'ORD-2027',date:'2025-05-04',items:[{n:'Sugar (white)',q:8},{n:'Creamer powder',q:5}],status:'pending',dn:null},
  {id:'ORD-2028',date:'2025-05-05',items:[{n:'Orange juice 1L',q:6}],status:'pending',dn:null},
];

const DN=[{id:'DN-2024',oid:'ORD-2024',date:'2025-04-29',by:'Ahmad Razif',recv:'Siti Norhaini',items:[{n:'Mineral water 500ml',u:'Carton (24)',ord:10,del:10},{n:'Coffee blend A',u:'Kg bag',ord:5,del:5}]}];

let cart={};

const titles={dashboard:'Dashboard',inventory:'Inventory',order:'Place order',orders:'My orders',delivery:'Delivery notes'};

function sChip(s){const m={pending:'chip-a',approved:'chip-b',delivered:'chip-g',rejected:'chip-r'};return`<span class="chip ${m[s]||'chip-gr'}">${s}</span>`}

function sBar(p){
  const pct=Math.min(100,Math.round(p.s/(p.th*3)*100));
  const col=p.s===0?'#E24B4A':p.s<=p.th?'#BA7517':'#639922';
  return`<span class="bar-wrap"><span class="bar-fill" style="width:${pct}%;background:${col}"></span></span>`;
}

function sStock(p){
  if(p.s===0)return`<span class="chip chip-r">Out of stock</span>`;
  if(p.s<=p.th)return`<span class="chip chip-a">Low stock</span>`;
  return`<span class="chip chip-g">Available</span>`;
}

function rDash(){
  document.getElementById('k-pend').textContent=O.filter(o=>o.status==='pending').length;
  document.getElementById('k-low').textContent=P.filter(p=>p.s>0&&p.s<=p.th).length;
  const rec=[...O].reverse().slice(0,5);
  document.getElementById('d-orders').innerHTML=rec.map(o=>`
    <div class="row">
      <span class="row-name">${o.id}<span class="row-sub"> · ${o.date}</span></span>
      <span style="font-size:12px;color:var(--color-text-tertiary)">${o.items.length} item${o.items.length>1?'s':''}</span>
      ${sChip(o.status)}
      ${o.dn?`<button class="btn" style="height:26px;padding:0 8px;font-size:11px" onclick="go('delivery')"><i class="ti ti-file-text" style="font-size:12px" aria-hidden="true"></i> DN</button>`:''}
    </div>`).join('');
  const lp=P.filter(p=>p.s<=p.th&&p.s>0);
  document.getElementById('d-low').innerHTML=lp.length?lp.map(p=>`
    <div class="row">
      <span class="row-name">${p.n}</span>
      ${sBar(p)} <span style="font-size:12px;color:var(--color-text-tertiary)">${p.s}</span>
      <button class="btn" style="height:26px;padding:0 8px;font-size:11px" onclick="go('order')">Order</button>
    </div>`).join(''):`<div class="empty">No low stock items ✓</div>`;
}

function rInv(){
  const q=document.getElementById('inv-q').value.toLowerCase();
  const cat=document.getElementById('inv-cat').value;
  const f=P.filter(p=>(!q||p.n.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q))&&(!cat||p.cat===cat));
  document.getElementById('inv-list').innerHTML=f.length?f.map(p=>`
    <div class="row" style="gap:12px">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:500;color:var(--color-text-primary)">${p.n}</div>
        <div style="font-size:11px;color:var(--color-text-tertiary)">${p.sku} · ${p.unit}</div>
      </div>
      <span class="chip chip-gr" style="font-size:11px">${p.cat}</span>
      ${sBar(p)} <span style="font-size:12px;color:var(--color-text-tertiary);min-width:20px">${p.s}</span>
      <span style="font-size:11px;color:var(--color-text-tertiary)">max ${p.max}</span>
      ${sStock(p)}
    </div>`).join(''):`<div class="empty">No products found</div>`;
}

function rOrd(){
  const q=document.getElementById('ord-q').value.toLowerCase();
  const f=P.filter(p=>!q||p.n.toLowerCase().includes(q));
  document.getElementById('ord-list').innerHTML=f.map(p=>`
    <div class="row" style="gap:12px">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:500;color:var(--color-text-primary)">${p.n}</div>
        <div style="font-size:11px;color:var(--color-text-tertiary)">${p.unit} · max ${p.max}</div>
      </div>
      ${sStock(p)}
      <div class="qty">
        <button class="qb" onclick="adj(${p.id},-1)" ${p.s===0?'disabled':''}>−</button>
        <input class="qi" id="qi-${p.id}" type="number" value="${cart[p.id]||0}" min="0" max="${p.max}" onchange="setQ(${p.id},this.value)" ${p.s===0?'disabled':''}>
        <button class="qb" onclick="adj(${p.id},1)" ${p.s===0?'disabled':''}>+</button>
      </div>
    </div>`).join('');
  updCart();
}

function adj(id,d){
  const p=P.find(x=>x.id===id);
  const nv=Math.max(0,Math.min(p.max,(cart[id]||0)+d));
  nv===0?delete cart[id]:cart[id]=nv;
  const el=document.getElementById('qi-'+id);
  if(el)el.value=nv;
  updCart();
}

function setQ(id,v){
  const p=P.find(x=>x.id===id);
  const nv=Math.max(0,Math.min(p.max,parseInt(v)||0));
  nv===0?delete cart[id]:cart[id]=nv;
  updCart();
}

function updCart(){
  document.getElementById('cart-n').textContent=Object.values(cart).reduce((a,b)=>a+b,0);
}

function submitOrder(){
  const items=Object.entries(cart).map(([id,q])=>({n:P.find(x=>x.id==id).n,q}));
  if(!items.length){toast('Add at least one item first.');return;}
  const nid='ORD-'+Math.floor(1000+Math.random()*9000);
  O.push({id:nid,date:new Date().toISOString().slice(0,10),items,status:'pending',dn:null});
  cart={};
  rOrd();rDash();rOrders('all');
  toast('Order '+nid+' submitted!');
  go('orders');
}

function rOrders(f){
  const list=f==='all'?[...O].reverse():[...O].reverse().filter(o=>o.status===f);
  document.getElementById('orders-list').innerHTML=list.length?list.map(o=>`
    <div class="row" style="gap:10px">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:500;color:var(--color-text-primary)">${o.id}</div>
        <div style="font-size:11px;color:var(--color-text-tertiary)">${o.date} · ${o.items.map(i=>`${i.q}× ${i.n}`).join(', ')}</div>
      </div>
      ${sChip(o.status)}
      ${o.dn?`<button class="btn" style="height:26px;padding:0 8px;font-size:11px" onclick="go('delivery')"><i class="ti ti-file-text" style="font-size:12px" aria-hidden="true"></i></button>`:''}
      <button class="btn" style="height:26px;padding:0 8px;font-size:11px;${o.status!=='pending'?'opacity:0.3;pointer-events:none':''}" onclick="cancelO('${o.id}')"><i class="ti ti-x" style="font-size:12px" aria-hidden="true"></i></button>
    </div>`).join(''):`<div class="empty">No orders found</div>`;
}

function cancelO(id){
  const o=O.find(x=>x.id===id);
  if(o&&o.status==='pending'){o.status='rejected';rOrders('all');rDash();toast('Order '+id+' cancelled.');}
}

function fOrders(f,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  rOrders(f);
}

function rDN(){
  document.getElementById('dn-list').innerHTML=DN.length?DN.map(d=>`
    <div class="dn-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-size:14px;font-weight:500;color:var(--color-text-primary)">${d.id}</span>
        <span class="chip chip-g">Delivered</span>
      </div>
      <div class="dn-grid">
        <div><div class="dn-f">Order</div><div class="dn-v">${d.oid}</div></div>
        <div><div class="dn-f">Date</div><div class="dn-v">${d.date}</div></div>
        <div><div class="dn-f">Delivered by</div><div class="dn-v">${d.by}</div></div>
        <div><div class="dn-f">Received by</div><div class="dn-v">${d.recv}</div></div>
      </div>
      <div style="border-top:0.5px solid var(--color-border-tertiary);padding-top:10px;margin-bottom:12px">
        ${d.items.map(i=>`
        <div class="row" style="gap:12px">
          <span style="flex:1;font-size:13px;color:var(--color-text-primary)">${i.n}</span>
          <span style="font-size:11px;color:var(--color-text-tertiary)">${i.u}</span>
          <span style="font-size:12px;color:var(--color-text-tertiary)">ordered ${i.ord}</span>
          <span class="chip ${i.del===i.ord?'chip-g':'chip-a'}">${i.del} delivered</span>
        </div>`).join('')}
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" style="height:28px;font-size:12px" onclick="toast('Downloading PDF…')"><i class="ti ti-download" style="font-size:13px" aria-hidden="true"></i> PDF</button>
        <button class="btn" style="height:28px;font-size:12px" onclick="toast('Sent to printer!')"><i class="ti ti-printer" style="font-size:13px" aria-hidden="true"></i> Print</button>
      </div>
    </div>`).join(''):`<div class="empty">No delivery notes yet</div>`;
}

function go(p){
  document.querySelectorAll('.pg').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.si').forEach(e=>e.classList.remove('active'));
  document.getElementById('pg-'+p).classList.add('on');
  document.getElementById('si-'+p).classList.add('active');
  document.getElementById('pg-title').textContent=titles[p];
  if(p==='inventory')rInv();
  if(p==='order')rOrd();
  if(p==='orders')rOrders('all');
  if(p==='delivery')rDN();
  if(p==='dashboard')rDash();
}

let tid;
function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m;t.classList.add('show');
  clearTimeout(tid);tid=setTimeout(()=>t.classList.remove('show'),2600);
}

rDash();
</script>
